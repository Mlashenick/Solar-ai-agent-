services:
  - type: web
    name: solar-ai-agent
    runtime: node
    plan: starter
    buildCommand: "echo no build step"
    startCommand: "npm start"
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: TIMEZONE
        value: America/Los_Angeles
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: HUBSPOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: REP_NAME
        sync: false
